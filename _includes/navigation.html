{% assign t = site.data.i18n[page.lang] | default: site.data.i18n.en %}
{% if page.lang == 'zh' %}{% assign p = '/zh' %}{% else %}{% assign p = '' %}{% endif %}
<nav class="site-nav">
  <ul>
    <li><a href="{{ p | append: '/' | relative_url }}" {% if page.url == '/' or page.url == '/zh/' %}class="active"{% endif %}>{{ t.home }}</a></li>
    <li><a href="{{ p | append: '/about/' | relative_url }}" {% if page.url contains '/about' %}class="active"{% endif %}>{{ t.about }}</a></li>
    <li><a href="{{ p | append: '/projects/' | relative_url }}" {% if page.url contains '/projects' %}class="active"{% endif %}>{{ t.projects }}</a></li>
    <li><a href="{{ p | append: '/pubs/' | relative_url }}" {% if page.url contains '/pubs' %}class="active"{% endif %}>{{ t.pubs }}</a></li>
    <li><a href="{{ '/docs/' | relative_url }}" {% if page.url contains '/docs' %}class="active"{% endif %}>{{ t.docs }}</a></li>
  </ul>
</nav>
